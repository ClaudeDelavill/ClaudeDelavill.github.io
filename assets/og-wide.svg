<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Le Ultime Collisioni — visual orizzontale ufficiale</title><desc id="desc">Visual promozionale del romanzo Le Ultime Collisioni di Claude Delavill.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#02050d"/><stop offset="55%" stop-color="#07152d"/><stop offset="100%" stop-color="#02050c"/></linearGradient><linearGradient id="ring" x1="0" x2="1"><stop offset="0%" stop-color="#31435d"/><stop offset="24%" stop-color="#a8c0de"/><stop offset="48%" stop-color="#eef6ff"/><stop offset="76%" stop-color="#8fa8c8"/><stop offset="100%" stop-color="#2e3d54"/></linearGradient><radialGradient id="spark"><stop offset="0%" stop-color="#fff"/><stop offset="38%" stop-color="#cde4ff"/><stop offset="72%" stop-color="#6aa4ff" stop-opacity=".6"/><stop offset="100%" stop-color="#6aa4ff" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><g opacity=".45" fill="#d8ecff"><circle cx="78" cy="64" r="1.4"/><circle cx="132" cy="120" r="1.2"/><circle cx="540" cy="46" r="1.1"/><circle cx="990" cy="90" r="1.2"/><circle cx="1114" cy="150" r="1.4"/><circle cx="1040" cy="518" r="1.2"/></g><text x="82" y="128" font-family="Arial,Helvetica,sans-serif" font-size="32" letter-spacing="6" fill="#eef5ff">LE ULTIME</text><text x="82" y="224" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="800" letter-spacing="2" fill="#eef5ff">COLLISIONI</text><text x="84" y="292" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#d9e7fb">Claude Delavill</text><line x1="84" y1="324" x2="435" y2="324" stroke="#7fb4ff" stroke-opacity=".75" stroke-width="2"/><text x="82" y="400" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="5" fill="#9db7d8">NEL DESERTO DEGLI ACCELERATORI</text><text x="82" y="458" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" fill="#e4eefb">E se un acceleratore di particelle non scoprisse qualcosa…</text><text x="82" y="492" font-family="Arial,Helvetica,sans-serif" font-size="22" font-style="italic" fill="#e4eefb">ma si facesse notare da qualcosa?</text><ellipse cx="872" cy="324" rx="256" ry="144" fill="none" stroke="url(#ring)" stroke-width="18"/><ellipse cx="872" cy="324" rx="256" ry="144" fill="none" stroke="#eff7ff" stroke-opacity=".22" stroke-width="3"/><path d="M852 462 C870 460 892 458 912 454" stroke="#07121f" stroke-width="22" stroke-linecap="round"/><g transform="translate(720 366)"><circle r="82" fill="url(#spark)" filter="url(#blur)"/><circle r="18" fill="#fff"/><path d="M-86 0 C-44 -14 -20 -10 0 0 C24 10 52 18 110 8" fill="none" stroke="#d9ecff" stroke-width="5" stroke-linecap="round"/><path d="M-52 -46 C-20 -16 -8 -8 0 0 C18 18 34 26 68 40" fill="none" stroke="#edf6ff" stroke-width="4" stroke-linecap="round"/><path d="M-46 44 C-14 16 -4 8 0 0 C16 -18 30 -26 60 -42" fill="none" stroke="#bddbff" stroke-width="3.8" stroke-linecap="round"/></g></svg>